const relTime = (d) => {
  const s = (Date.now() - new Date(d).getTime()) / 1000;
  if (s < 60) return 'just now';
  if (s < 3600) return `${Math.floor(s/60)}m ago`;
  if (s < 86400) return `${Math.floor(s/3600)}h ago`;
  return `${Math.floor(s/86400)}d ago`;
};

function seedOrders() {
  const now = Date.now();
  const rand = (a,b) => a + Math.floor(Math.random()*(b-a+1));
  const list = [];
  for (let i = 0; i < 24; i++) {
    const cust = CUSTOMERS[rand(0, CUSTOMERS.length-1)];
    const itemCount = rand(1,4);
    const items = [];
    const used = new Set();
    for (let k=0; k<itemCount; k++) {
      let p; do { p = PRODUCTS_SEED[rand(0, PRODUCTS_SEED.length-1)]; } while (used.has(p.id));
      used.add(p.id);
      const qty = rand(1,3);
      items.push({ id:p.id, name:p.name, emoji:p.emoji, unit:p.unit, qty, unitPrice:p.price });
    }
    const subtotal = items.reduce((s,i)=> s + i.unitPrice*i.qty, 0);
    const bundle   = items.filter(i=>i.id.startsWith('c')).reduce((s,i)=> s + Math.round(i.unitPrice*i.qty*0.15), 0);
    const fulfillment = Math.random() < 0.75 ? 'delivery' : 'pickup';
    const deliveryFee = fulfillment==='pickup' ? 0 : (subtotal - bundle >= 1500 ? 0 : 60);
    const grand = subtotal - bundle + deliveryFee;
    const hoursAgo = i===0 ? 0.05 : i===1 ? 0.3 : i<4 ? rand(1,6) : i<8 ? rand(6,24) : rand(24, 24*7);
    const placedAt = new Date(now - hoursAgo*3600*1000);
    // Status distribution: recent = new/packing, older = delivered
    let status;
    if (hoursAgo < 0.5)  status = 'received';
    else if (hoursAgo < 2) status = Math.random()<0.5 ? 'received' : 'packing';
    else if (hoursAgo < 6) status = ['packing','out_for_delivery'][rand(0,1)];
    else if (hoursAgo < 24) status = Math.random()<0.15 ? 'cancelled' : (Math.random()<0.4 ? 'out_for_delivery' : 'delivered');
    else                 status = Math.random()<0.1 ? 'cancelled' : 'delivered';
    const paymentPick = ['bkash','card','cod'][rand(0,2)];
    list.push({
      id: `MM-2026-${(8000 + i).toString()}`,
      placedAt: placedAt.toISOString(),
      customer: cust,
      fulfillment,
      items,
      subtotal, bundle, deliveryFee, packaging: items.some(i=>i.id.startsWith('i')) ? 40 : 0,
      grand: grand + (items.some(i=>i.id.startsWith('i')) ? 40 : 0),
      status, payment: paymentPick,
      note: i%5===0 ? 'Please deliver before 7pm, it is a surprise 🎂' : '',
    });
  }
  return list.sort((a,b) => new Date(b.placedAt) - new Date(a.placedAt));
}

function App() {

  if (!auth) return <Login onPass={() => { localStorage.setItem('misti-admin-auth','1'); setAuth(true); }}/>;
  return <Shell onLogout={() => { localStorage.removeItem('misti-admin-auth'); setAuth(false); }}/>;
}

          <div className="font-serif font-black text-xl">Mishti &amp; More</div>
          <div className="text-xs text-stone-500">Admin Panel · Staff Only</div>

        </div>
        {err && <div className="text-xs text-berry">{err}</div>}

/* ============================================================
   Shell with sidebar + top bar
   ============================================================ */
function Shell({ onLogout }) {
  const [tab, setTab] = useState('dashboard');
  const [orders, setOrders] = useState(() => {
    const s = localStorage.getItem('misti-orders');
    return s ? JSON.parse(s) : seedOrders();
  });
  const [products, setProducts] = useState(() => {
    const s = localStorage.getItem('misti-products');
    return s ? JSON.parse(s) : PRODUCTS_SEED;
  });
  const [celeb, setCeleb] = useState(() => {
    const s = localStorage.getItem('misti-celeb');
    return s ? JSON.parse(s) : seedCeleb();
  });
  const [mobile, setMobile] = useState(false);

  useEffect(() => { localStorage.setItem('misti-orders', JSON.stringify(orders)); }, [orders]);
  useEffect(() => { localStorage.setItem('misti-products', JSON.stringify(products)); }, [products]);
  useEffect(() => { localStorage.setItem('misti-celeb', JSON.stringify(celeb)); }, [celeb]);

  function resetAll() {
    if (!confirm('Reset all demo data (orders, products, celebration club) back to seed values?')) return;
    localStorage.removeItem('misti-orders'); localStorage.removeItem('misti-products'); localStorage.removeItem('misti-celeb');
    setOrders(seedOrders()); setProducts(PRODUCTS_SEED); setCeleb(seedCeleb());
  }

  const NAV = [
    { id:'dashboard', label:'Dashboard',       icon:Icon.Dash },
    { id:'orders',    label:'Orders',          icon:Icon.Cart,  badge: orders.filter(o=>o.status==='received').length || null },
    { id:'products',  label:'Products',        icon:Icon.Box,   badge: products.filter(p=>p.stock<15).length || null },
    { id:'celeb',     label:'Celebration Club',icon:Icon.Heart },
    { id:'pos',       label:'Walk-in POS',     icon:Icon.Pos },
    { id:'reports',   label:'Reports',         icon:Icon.Chart },
  ];

  return <div className="min-h-screen flex bg-[#faf7f2]">
    {/* Sidebar */}
    <aside className={`${mobile?'translate-x-0':'-translate-x-full'} lg:translate-x-0 fixed lg:static z-40 h-screen w-64 bg-espresso text-stone-300 flex flex-col transition-transform`}>
      <div className="h-16 px-5 flex items-center gap-3 border-b border-stone-800">
        <div className="h-9 w-9 rounded-full bg-gradient-to-br from-saffron to-berry grid place-items-center text-white font-serif font-black">M</div>
        <div>
          <div className="font-serif font-bold text-cream text-base leading-tight">Mishti &amp; More</div>
          <div className="text-[10px] uppercase tracking-widest text-stone-500">Admin Panel</div>
        </div>
      </div>
      <nav className="flex-1 overflow-y-auto py-3 px-2 space-y-0.5">
        {NAV.map(n => <button key={n.id} onClick={()=>{ setTab(n.id); setMobile(false); }}
          className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition ${tab===n.id ? 'bg-saffron text-white shadow' : 'text-stone-300 hover:bg-stone-800 hover:text-cream'}`}>
          <n.icon size={18}/> <span className="flex-1 text-left">{n.label}</span>
          {n.badge != null && <span className={`text-[10px] font-bold px-1.5 py-0.5 rounded-full ${tab===n.id?'bg-white/20 text-white':'bg-berry text-white'}`}>{n.badge}</span>}
        </button>)}
      </nav>
      <div className="px-3 pb-3 space-y-1">
        <a href="/" target="_blank" className="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-stone-300 hover:bg-stone-800 hover:text-cream"><Icon.Open size={16}/> View Storefront</a>
        <button onClick={resetAll} className="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-stone-400 hover:bg-stone-800"><Icon.Refresh size={16}/> Reset Demo Data</button>
        <button onClick={onLogout} className="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-stone-400 hover:bg-berry/20 hover:text-berry"><Icon.Logout size={16}/> Sign Out</button>
      </div>
    </aside>

    {mobile && <div className="fixed inset-0 bg-black/40 z-30 lg:hidden" onClick={()=>setMobile(false)}/>}

    {/* Main */}
    <main className="flex-1 min-w-0 flex flex-col">
      <TopBar onMenu={()=>setMobile(true)} orders={orders}/>
      <div className="flex-1 overflow-y-auto">
        <div key={tab} className="animate-fade-in">
          {tab==='dashboard' && <Dashboard orders={orders} products={products} celeb={celeb} onNav={setTab}/>}
          {tab==='orders'    && <Orders orders={orders} setOrders={setOrders}/>}
          {tab==='products'  && <Products products={products} setProducts={setProducts}/>}
          {tab==='celeb'     && <Celeb celeb={celeb} setCeleb={setCeleb}/>}
          {tab==='pos'       && <Pos products={products} setProducts={setProducts} orders={orders} setOrders={setOrders}/>}
          {tab==='reports'   && <Reports orders={orders}/>}

      </div>
    </main>
  </div>;
}

/* ============================================================
   Dashboard
   ============================================================ */
function Dashboard({ orders, products, celeb, onNav }) {
  const today = new Date(); today.setHours(0,0,0,0);
  const yday  = new Date(today); yday.setDate(yday.getDate()-1);
  const todayOrders = orders.filter(o => new Date(o.placedAt) >= today);
  const yesterdayOrders = orders.filter(o => { const d = new Date(o.placedAt); return d >= yday && d < today; });
  const revToday = todayOrders.filter(o=>o.status!=='cancelled').reduce((s,o)=>s+o.grand, 0);
  const revYday  = yesterdayOrders.filter(o=>o.status!=='cancelled').reduce((s,o)=>s+o.grand, 0);
  const pending = orders.filter(o => o.status==='received' || o.status==='packing').length;
  const lowStock = products.filter(p => p.stock < 15);
  const upcomingCeleb = celeb.filter(c => { const d = new Date(c.date); const diff = (d - today)/(86400*1000); return diff >= 0 && diff <= 30; });

  // 7-day sales
  const sales7 = Array.from({length:7}, (_,i) => {
    const day = new Date(today); day.setDate(day.getDate() - (6-i));
    const next = new Date(day); next.setDate(next.getDate()+1);
    const total = orders.filter(o => { const d = new Date(o.placedAt); return d>=day && d<next && o.status!=='cancelled'; }).reduce((s,o)=>s+o.grand, 0);
    return { label: day.toLocaleDateString('en-GB',{weekday:'short'}), total };
  });
  const maxSale = Math.max(...sales7.map(s=>s.total), 1);

  // Top products
  const topMap = {};
  orders.filter(o=>o.status!=='cancelled').forEach(o => o.items.forEach(i => { topMap[i.id] = (topMap[i.id]||0) + i.qty; }));
  const topProducts = Object.entries(topMap).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([id,qty]) => ({ p: products.find(x=>x.id===id), qty }));

  const delta = revYday > 0 ? Math.round((revToday - revYday)/revYday * 100) : 0;

  return <div className="p-4 sm:p-6 lg:p-8 space-y-6">
    <div className="flex items-end justify-between flex-wrap gap-2">
      <div>
        <h1 className="font-serif text-3xl font-black">Good {new Date().getHours()<12?'morning':new Date().getHours()<17?'afternoon':'evening'}, Ariful</h1>
        <p className="text-stone-500 text-sm mt-1">Here's what's happening at your Dhanmondi counter today.</p>
      </div>
      <div className="text-right text-xs text-stone-500">
        <div className="font-semibold text-espresso">{new Date().toLocaleDateString('en-GB',{weekday:'long', day:'numeric', month:'long', year:'numeric'})}</div>
        <div>{fmtTime(new Date())}</div>
      </div>
    </div>

    {/* KPI cards */}
    <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4">
      <Kpi icon={<Icon.Cart size={18}/>} tone="saffron" label="Orders Today" value={todayOrders.length} delta={todayOrders.length - yesterdayOrders.length} suffix=" vs yday"/>
      <Kpi icon={<Icon.Wallet size={18}/>} tone="emerald" label="Revenue Today" value={BDT(revToday)} delta={delta} suffix="%" unit=""/>
      <Kpi icon={<Icon.Clock size={18}/>} tone="rose"    label="Pending Orders" value={pending} click={()=>onNav('orders')}/>
      <Kpi icon={<Icon.Box size={18}/>}   tone="amber"   label="Low Stock Items" value={lowStock.length} click={()=>onNav('products')}/>
    </div>

    <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
      {/* Sales chart */}
      <Card className="lg:col-span-2">
        <CardHead title="Sales · Last 7 days" right={<div className="text-xs text-stone-500">Grand total: <span className="font-semibold text-espresso">{BDT(sales7.reduce((s,d)=>s+d.total,0))}</span></div>}/>
        <div className="flex items-end gap-2 h-48 mt-2 px-1">
          {sales7.map((d,i) => <div key={i} className="flex-1 flex flex-col items-center gap-1 group">
            <div className="text-[10px] font-bold text-stone-500 group-hover:text-saffron">{BDT(d.total)}</div>
            <div className="w-full rounded-t-lg bg-gradient-to-t from-saffron to-amber-300 relative overflow-hidden transition-all hover:from-berry hover:to-rose-400" style={{ height: `${Math.max(6, (d.total/maxSale)*160)}px` }}>
              <div className="absolute inset-0 bg-white/0 group-hover:bg-white/10"/>
            </div>
            <div className="text-[11px] text-stone-500">{d.label}</div>
          </div>)}
        </div>
      </Card>

      {/* Top products */}
      <Card>
        <CardHead title="Top Sellers · Last 7 days"/>
        <ul className="divide-y divide-stone-100 mt-2">
          {topProducts.map(({p,qty},i) => p && <li key={p.id} className="py-2.5 flex items-center gap-3">
            <div className="h-10 w-10 rounded-lg bg-gradient-to-br from-amber-100 to-rose-100 grid place-items-center text-xl">{p.emoji}</div>
            <div className="flex-1 min-w-0">
              <div className="text-sm font-semibold truncate">{p.name}</div>
              <div className="text-[11px] text-stone-500">{CAT.find(c=>c.id===p.cat)?.label}</div>
            </div>
            <div className="text-right">
              <div className="text-sm font-bold">{qty}</div>
              <div className="text-[10px] text-stone-500 uppercase tracking-wider">sold</div>
            </div>
            <div className="text-[10px] font-bold text-stone-400 w-4">#{i+1}</div>
          </li>)}
        </ul>
      </Card>
    </div>

    {/* Recent orders + upcoming celebrations */}
    <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
      <Card className="lg:col-span-2">
        <CardHead title="Recent Orders" right={<button onClick={()=>onNav('orders')} className="text-xs font-semibold text-saffron hover:text-saffrondark">View all →</button>}/>
        <ul className="divide-y divide-stone-100">
          {orders.slice(0,6).map(o => <li key={o.id} className="py-3 flex items-center gap-3">
            <StatusDot status={o.status}/>
            <div className="flex-1 min-w-0">
              <div className="flex items-center gap-2 flex-wrap">
                <div className="font-mono font-bold text-sm">#{o.id}</div>
                <StatusPill status={o.status}/>
              </div>
              <div className="text-[11px] text-stone-500 truncate">{o.customer.name} · {o.customer.area} · {relTime(o.placedAt)}</div>
            </div>
            <div className="text-right">
              <div className="font-bold text-sm">{BDT(o.grand)}</div>
              <div className="text-[10px] text-stone-500 uppercase tracking-wider">{o.items.length} item{o.items.length>1?'s':''}</div>
            </div>
          </li>)}
        </ul>
      </Card>

      <Card>
        <CardHead title="Upcoming Celebrations"/>
        <ul className="divide-y divide-stone-100">
          {upcomingCeleb.slice(0,6).map((c,i) => {
            const d = new Date(c.date); d.setHours(0,0,0,0);
            const days = Math.round((d - today)/(86400*1000));
            return <li key={i} className="py-2.5 flex items-center gap-3">
              <div className="h-10 w-10 rounded-full bg-rose-100 text-berry grid place-items-center"><Icon.Heart size={16}/></div>
              <div className="flex-1 min-w-0">
                <div className="text-sm font-semibold truncate">{c.person}</div>
                <div className="text-[11px] text-stone-500">{c.occasion} · {fmtDate(c.date)}</div>
              </div>
              <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${days<=3?'bg-berry text-white':days<=7?'bg-amber-200 text-amber-900':'bg-stone-100 text-stone-600'}`}>{days===0?'TODAY':`in ${days}d`}</span>
            </li>;
          })}
        </ul>
      </Card>
    </div>

    {/* Low stock warning */}
    {lowStock.length > 0 && <Card>
      <CardHead title="⚠️ Low Stock — Replenish Soon" right={<span className="text-xs text-stone-500">{lowStock.length} items below 15 units</span>}/>
      <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-2 mt-2">
        {lowStock.map(p => <div key={p.id} className="p-3 rounded-xl bg-amber-50 border border-amber-200 flex items-center gap-2">
          <div className="text-2xl">{p.emoji}</div>
          <div className="min-w-0">
            <div className="text-xs font-semibold truncate">{p.name}</div>
            <div className="text-[10px] text-amber-700 font-bold">{p.stock} {p.unit} left</div>
          </div>
        </div>)}
      </div>
    </Card>}
  </div>;
}

function Kpi({ icon, tone, label, value, delta, suffix='', click }) {
  const tones = { saffron:'from-amber-200 to-amber-100 text-saffrondark', emerald:'from-emerald-200 to-emerald-100 text-emerald-700', rose:'from-rose-200 to-rose-100 text-berry', amber:'from-yellow-200 to-yellow-100 text-amber-800' };
  return <button onClick={click} disabled={!click} className={`bg-white rounded-2xl p-4 border border-stone-100 text-left hover:shadow-md transition disabled:cursor-default`}>
    <div className="flex items-center justify-between mb-2">
      <div className={`h-9 w-9 rounded-xl bg-gradient-to-br ${tones[tone]} grid place-items-center`}>{icon}</div>
      {delta != null && <span className={`text-[10px] font-bold px-1.5 py-0.5 rounded-full ${delta>0?'bg-emerald-100 text-emerald-700':delta<0?'bg-rose-100 text-berry':'bg-stone-100 text-stone-600'}`}>{delta>0?'+':''}{delta}{suffix}</span>}
    </div>
    <div className="text-[11px] uppercase tracking-wider text-stone-500 font-semibold">{label}</div>
    <div className="font-serif font-black text-2xl text-espresso mt-0.5">{value}</div>
  </button>;
}
function Card({ className='', children }) { return <div className={`bg-white rounded-2xl p-4 sm:p-5 border border-stone-100 ${className}`}>{children}</div>; }
function CardHead({ title, right }) { return <div className="flex items-center justify-between mb-2"><div className="font-serif font-bold text-base">{title}</div>{right}</div>; }

function StatusDot({ status }) {
  const dots = { received:'bg-berry animate-pulse', packing:'bg-amber-500', out_for_delivery:'bg-sky-500', delivered:'bg-emerald-500', cancelled:'bg-stone-400' };
  return <span className={`h-2.5 w-2.5 rounded-full shrink-0 ${dots[status]}`}/>;
}
function StatusPill({ status }) {
  const colors = { rose:'bg-rose-100 text-berry border-rose-200', amber:'bg-amber-100 text-amber-900 border-amber-200', sky:'bg-sky-100 text-sky-700 border-sky-200', emerald:'bg-emerald-100 text-emerald-700 border-emerald-200', stone:'bg-stone-100 text-stone-600 border-stone-200' };
  return <span className={`inline-flex items-center gap-1 text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-full border ${colors[STATUS[status].color]}`}>{STATUS[status].label}</span>;
}

/* ============================================================
   Orders tab
   ============================================================ */
function Orders({ orders, setOrders }) {
  const [filter, setFilter] = useState('all');
  const [search, setSearch] = useState('');
  const [open, setOpen] = useState(null); // order id

  const list = useMemo(() => {
    let l = orders;
    if (filter !== 'all') l = l.filter(o => o.status === filter);
    if (search.trim()) {
      const q = search.toLowerCase();
      l = l.filter(o => o.id.toLowerCase().includes(q) || o.customer.name.toLowerCase().includes(q) || o.customer.phone.includes(q));
    }
    return l;
  }, [orders, filter, search]);

  function advance(id) {
    setOrders(prev => prev.map(o => {
      if (o.id !== id) return o;
      const nx = STATUS[o.status].next;
      if (!nx) return o;
      return { ...o, status: nx };
    }));
  }
  function cancel(id) {
    if (!confirm('Cancel this order?')) return;
    setOrders(prev => prev.map(o => o.id===id ? {...o, status:'cancelled'} : o));
  }

  const counts = useMemo(() => {
    const c = { all: orders.length };
    Object.keys(STATUS).forEach(s => c[s] = orders.filter(o=>o.status===s).length);
    return c;
  }, [orders]);

  return <div className="p-4 sm:p-6 lg:p-8 space-y-4">
    <div>
      <h1 className="font-serif text-3xl font-black">Orders</h1>
      <p className="text-stone-500 text-sm mt-1">Manage incoming orders, update status, and print invoices.</p>
    </div>

    <div className="flex flex-wrap items-center gap-2 bg-white p-2 rounded-2xl border border-stone-100">
      <div className="flex gap-1 overflow-x-auto no-scrollbar flex-1 min-w-0">
        <FilterPill active={filter==='all'} onClick={()=>setFilter('all')} label={`All · ${counts.all}`}/>
        {Object.entries(STATUS).map(([s,meta]) => <FilterPill key={s} active={filter===s} onClick={()=>setFilter(s)} label={`${meta.label} · ${counts[s]||0}`} color={meta.color}/>)}
      </div>
      <div className="relative shrink-0">
        <Icon.Search cls="absolute left-3 top-1/2 -translate-y-1/2 text-stone-400" size={14}/>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Order ID / phone / name" className="pl-8 pr-3 h-9 rounded-full bg-stone-100 text-xs outline-none focus:bg-white focus:ring-2 focus:ring-amber-100 w-56"/>
      </div>
    </div>

    <div className="bg-white rounded-2xl border border-stone-100 overflow-hidden">
      <div className="hidden md:grid grid-cols-12 gap-3 px-4 py-2.5 bg-stone-50 border-b border-stone-100 text-[10px] font-bold uppercase tracking-wider text-stone-500">
        <div className="col-span-2">Order ID</div>
        <div className="col-span-3">Customer</div>
        <div className="col-span-2">Items</div>
        <div className="col-span-2">Total</div>
        <div className="col-span-2">Status</div>
        <div className="col-span-1 text-right">Action</div>
      </div>
      <ul className="divide-y divide-stone-100">
        {list.length === 0 && <li className="p-10 text-center text-stone-500 text-sm">No orders match your filter.</li>}
        {list.map(o => <li key={o.id} className="p-4 md:grid md:grid-cols-12 md:gap-3 md:items-center hover:bg-stone-50 transition">
          <div className="col-span-2 flex md:block items-start justify-between">
            <div>
              <div className="font-mono font-bold text-sm">#{o.id}</div>
              <div className="text-[10px] text-stone-500">{relTime(o.placedAt)}</div>
            </div>
            <div className="md:hidden"><StatusPill status={o.status}/></div>
          </div>
          <div className="col-span-3 mt-2 md:mt-0">
            <div className="text-sm font-semibold">{o.customer.name}</div>
            <div className="text-[11px] text-stone-500 flex items-center gap-1.5">
              <Icon.Phone size={11}/> {o.customer.phone}
              {o.fulfillment==='pickup' ? <><Icon.Store size={11} cls="ml-1"/> Pickup</> : <><Icon.MapPin size={11} cls="ml-1"/> {o.customer.area}</>}

          <div className="col-span-2 mt-2 md:mt-0 flex -space-x-1">
            {o.items.slice(0,4).map((i,k) => <div key={k} title={`${i.name} × ${i.qty}`} className="h-8 w-8 rounded-full bg-gradient-to-br from-amber-100 to-rose-100 border-2 border-white grid place-items-center text-sm">{i.emoji}</div>)}
            {o.items.length>4 && <div className="h-8 w-8 rounded-full bg-stone-100 border-2 border-white grid place-items-center text-[10px] font-bold text-stone-500">+{o.items.length-4}</div>}
          </div>
          <div className="col-span-2 mt-2 md:mt-0">
            <div className="font-bold text-sm">{BDT(o.grand)}</div>
            <div className="text-[10px] text-stone-500 inline-flex items-center gap-1 uppercase tracking-wider">
              {o.payment==='bkash' ? <Icon.Wallet size={11}/> : o.payment==='card' ? <Icon.Card size={11}/> : <Icon.Bank size={11}/>} {o.payment}
            </div>
          </div>
          <div className="hidden md:block col-span-2"><StatusPill status={o.status}/></div>
          <div className="col-span-1 flex md:justify-end gap-1 mt-3 md:mt-0">
            <button onClick={()=>setOpen(o.id)} className="px-2.5 py-1.5 rounded-lg text-xs font-semibold bg-stone-100 hover:bg-stone-200">View</button>
            {STATUS[o.status].next && <button onClick={()=>advance(o.id)} className="px-2.5 py-1.5 rounded-lg text-xs font-semibold bg-saffron text-white hover:bg-saffrondark">→</button>}
          </div>
        </li>)}
      </ul>
    </div>

    {open && <OrderDrawer order={orders.find(o=>o.id===open)} onClose={()=>setOpen(null)} advance={advance} cancel={cancel}/>}
  </div>;
}

function FilterPill({ active, onClick, label, color }) {
  const activeColors = { rose:'bg-berry text-white', amber:'bg-amber-500 text-white', sky:'bg-sky-500 text-white', emerald:'bg-emerald-500 text-white', stone:'bg-stone-500 text-white' };
  const act = color && active ? activeColors[color] : active ? 'bg-espresso text-white' : 'bg-transparent text-stone-600 hover:bg-stone-100';
  return <button onClick={onClick} className={`shrink-0 px-3 py-1.5 rounded-full text-xs font-semibold transition ${act}`}>{label}</button>;
}

function OrderDrawer({ order, onClose, advance, cancel }) {
  if (!order) return null;
  return <div className="fixed inset-0 z-50 flex">
    <div className="absolute inset-0 bg-black/50" onClick={onClose}/>
    <div className="relative ml-auto h-full w-full max-w-lg bg-white shadow-2xl flex flex-col animate-fade-in">
      <div className="shrink-0 px-5 py-4 border-b border-stone-100 flex items-center justify-between">
        <div>
          <div className="font-mono font-bold">#{order.id}</div>
          <div className="text-xs text-stone-500">{fmtDT(order.placedAt)}</div>
        </div>
        <button onClick={onClose} className="h-9 w-9 grid place-items-center rounded-full hover:bg-stone-100"><Icon.X size={18}/></button>
      </div>
      <div className="flex-1 overflow-y-auto p-5 space-y-4">
        <div className="flex items-center justify-between">
          <StatusPill status={order.status}/>
          <div className="text-xs text-stone-500 inline-flex items-center gap-1.5">
            {order.payment==='bkash' ? <Icon.Wallet size={14}/> : order.payment==='card' ? <Icon.Card size={14}/> : <Icon.Bank size={14}/>} Payment: <span className="font-semibold text-espresso uppercase">{order.payment}</span>
          </div>
        </div>

        <div className="bg-stone-50 rounded-xl p-4 text-sm">
          <div className="font-semibold">{order.customer.name}</div>
          <div className="text-stone-600 text-xs flex items-center gap-1.5 mt-1"><Icon.Phone size={12}/> {order.customer.phone}</div>
          <div className="text-stone-600 text-xs flex items-center gap-1.5 mt-1">
            {order.fulfillment==='pickup' ? <><Icon.Store size={12}/> In-Store Pickup · Dhanmondi Counter</> : <><Icon.Truck size={12}/> Delivery to {order.customer.area}</>}
          </div>
          {order.fulfillment==='delivery' && <div className="text-stone-500 text-xs mt-1 pl-5">{order.customer.addr}</div>}
          {order.note && <div className="mt-2 text-xs italic text-berry bg-rose-50 border border-rose-100 px-2 py-1.5 rounded-lg">✍️ "{order.note}"</div>}
        </div>

        <div>
          <div className="text-xs font-bold uppercase tracking-wider text-stone-500 mb-2">Items</div>
          <ul className="divide-y divide-stone-100">
            {order.items.map((i,k) => <li key={k} className="py-2.5 flex items-center gap-3">
              <div className="h-10 w-10 rounded-lg bg-gradient-to-br from-amber-100 to-rose-100 grid place-items-center text-xl">{i.emoji}</div>
              <div className="flex-1 min-w-0">
                <div className="text-sm font-semibold truncate">{i.name}</div>
                <div className="text-[11px] text-stone-500">{i.qty} × {BDT(i.unitPrice)} · {i.unit}</div>
              </div>
              <div className="text-sm font-bold">{BDT(i.unitPrice * i.qty)}</div>
            </li>)}
          </ul>
        </div>

        <div className="bg-stone-50 rounded-xl p-4 text-sm space-y-1">
          <Row label="Subtotal" value={BDT(order.subtotal)}/>
          {order.bundle>0 && <Row label="Bundle −15%" value={`−${BDT(order.bundle)}`} tone="berry"/>}
          {order.packaging>0 && <Row label="Cold-chain pack" value={BDT(order.packaging)} muted/>}
          <Row label={order.fulfillment==='pickup'?'Pickup':'Delivery'} value={order.deliveryFee===0?'FREE':BDT(order.deliveryFee)} muted/>
          <div className="pt-2 border-t border-stone-200 flex items-center justify-between">
            <div className="font-serif font-bold">Grand Total</div>
            <div className="font-serif font-black text-xl">{BDT(order.grand)}</div>
          </div>
        </div>
      </div>
      <div className="shrink-0 border-t border-stone-100 p-4 flex items-center gap-2">
        {order.status !== 'cancelled' && order.status !== 'delivered' && <>
          <button onClick={()=>cancel(order.id)} className="px-3 py-2 rounded-full text-xs font-semibold text-berry border border-rose-200 hover:bg-rose-50">Cancel</button>
          {STATUS[order.status].next && <button onClick={()=>advance(order.id)} className="flex-1 bg-saffron text-white px-4 py-2 rounded-full text-sm font-semibold hover:bg-saffrondark">
            Mark as {STATUS[STATUS[order.status].next].label} →
          </button>}
        </>}
        <a href={`https://wa.me/${order.customer.phone.replace(/\D/g,'').replace(/^0/,'88')}?text=${encodeURIComponent(`Hello ${order.customer.name}, your Mishti & More order #${order.id} is ${STATUS[order.status].label.toLowerCase()}.`)}`} target="_blank" className="px-3 py-2 rounded-full text-xs font-semibold bg-emerald-500 text-white hover:bg-emerald-600 inline-flex items-center gap-1"><Icon.Whats size={13}/> Notify</a>

function Row({ label, value, tone, muted }) {
  const tones = { base:'text-espresso', berry:'text-berry', emerald:'text-emerald-700' };
  return <div className="flex items-center justify-between"><span className={muted?'text-stone-500':''}>{label}</span><span className={`font-semibold ${tones[tone||'base']}`}>{value}</span></div>;
}

/* ============================================================
   Products tab — full CRUD with image upload / URL
   ============================================================ */
const EMOJI_CHOICES = ['🎉','🧁','🍡','🍬','🟤','⚫','⚪','🟡','🥣','🍰','❤️','🍫','🍮','🍞','🥐','🔺','🥠','🍕','🍨','🍦','🥭','🥛','🧃','🥫','🥔','🎈','🕯️','0️⃣','🎊','🎩','🎂','🍪','☕','🍩','🧊','🎀'];

function Products({ products, setProducts }) {
  const [filter, setFilter] = useState('all');
  const [search, setSearch] = useState('');
  const [editing, setEditing] = useState(null); // product object (or {id:null,...} for new)

  const list = useMemo(() => {
    let l = products;
    if (filter !== 'all') l = l.filter(p => p.cat === filter);
    if (search.trim()) l = l.filter(p => p.name.toLowerCase().includes(search.toLowerCase()));
    return l;
  }, [products, filter, search]);

  function updateStock(id, delta) {
    setProducts(prev => prev.map(p => p.id===id ? {...p, stock: Math.max(0, p.stock + delta)} : p));
  }
  function startNew() {
    setEditing({ id:null, cat: filter==='all'?'mishti':filter, name:'', emoji:'🍡', image:'', desc:'', price:0, unit:'pc', stock:0 });
  }
  function startEdit(p) { setEditing({ ...p }); }
  function saveProduct(p) {
    if (!p.name.trim()) { alert('Please enter a product name.'); return; }
    if (p.id == null) {
      const id = `x${Date.now().toString(36)}`;
      setProducts(prev => [{ ...p, id, price:Number(p.price)||0, stock:Number(p.stock)||0 }, ...prev]);
    } else {
      setProducts(prev => prev.map(x => x.id===p.id ? { ...p, price:Number(p.price)||0, stock:Number(p.stock)||0 } : x));
    }
    setEditing(null);
  }
  function deleteProduct(id) {
    if (!confirm('Delete this product? This cannot be undone.')) return;
    setProducts(prev => prev.filter(p => p.id !== id));
  }

  return <div className="p-4 sm:p-6 lg:p-8 space-y-4">
    <div className="flex items-end justify-between flex-wrap gap-2">
      <div>
        <h1 className="font-serif text-3xl font-black">Products &amp; Inventory</h1>
        <p className="text-stone-500 text-sm mt-1">Add, edit, or remove products. Click any row to edit name, image, price, and more.</p>
      </div>
      <button onClick={startNew} className="inline-flex items-center gap-1.5 bg-espresso text-cream px-4 py-2 rounded-full text-sm font-semibold hover:bg-stone-800"><Icon.Plus size={15}/> Add Product</button>
    </div>

    <div className="flex flex-wrap items-center gap-2 bg-white p-2 rounded-2xl border border-stone-100">
      <div className="flex gap-1 overflow-x-auto no-scrollbar flex-1 min-w-0">
        <FilterPill active={filter==='all'} onClick={()=>setFilter('all')} label={`All · ${products.length}`}/>
        {CAT.map(c => <FilterPill key={c.id} active={filter===c.id} onClick={()=>setFilter(c.id)} label={`${c.emoji} ${c.label} · ${products.filter(p=>p.cat===c.id).length}`}/>)}
      </div>
      <div className="relative shrink-0">
        <Icon.Search cls="absolute left-3 top-1/2 -translate-y-1/2 text-stone-400" size={14}/>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search products" className="pl-8 pr-3 h-9 rounded-full bg-stone-100 text-xs outline-none focus:bg-white focus:ring-2 focus:ring-amber-100 w-56"/>
      </div>
    </div>

    <div className="bg-white rounded-2xl border border-stone-100 overflow-hidden">
      <div className="hidden md:grid grid-cols-12 gap-3 px-4 py-2.5 bg-stone-50 border-b border-stone-100 text-[10px] font-bold uppercase tracking-wider text-stone-500">
        <div className="col-span-5">Product</div>
        <div className="col-span-2">Category</div>
        <div className="col-span-2">Price</div>
        <div className="col-span-2">Stock</div>
        <div className="col-span-1 text-right">Actions</div>
      </div>
      <ul className="divide-y divide-stone-100">
        {list.length === 0 && <li className="p-10 text-center text-stone-500 text-sm">No products match your filter.</li>}
        {list.map(p => <li key={p.id} className="p-4 md:grid md:grid-cols-12 md:gap-3 md:items-center hover:bg-stone-50 transition group">
          <div className="col-span-5 flex items-center gap-3 min-w-0">
            <ProductThumb p={p}/>
            <div className="min-w-0 flex-1">
              <div className="font-semibold text-sm truncate">{p.name}</div>
              <div className="text-[11px] text-stone-500 truncate">ID: {p.id} · per {p.unit}{p.desc?` · ${p.desc}`:''}</div>
            </div>
          </div>
          <div className="col-span-2 mt-2 md:mt-0 text-xs text-stone-600">{CAT.find(c=>c.id===p.cat)?.label}</div>
          <div className="col-span-2 mt-2 md:mt-0">
            <div className="font-bold text-sm">{BDT(p.price)}</div>
            <div className="text-[10px] text-stone-400">per {p.unit}</div>
          </div>
          <div className="col-span-2 mt-3 md:mt-0 flex items-center gap-2">
            <div className="flex items-center rounded-full bg-amber-50 border border-amber-200 overflow-hidden">
              <button onClick={()=>updateStock(p.id,-1)} className="h-7 w-7 grid place-items-center hover:bg-amber-100 text-saffrondark"><Icon.Minus size={12}/></button>
              <span className={`min-w-[40px] text-center text-sm font-bold ${p.stock<15?'text-berry':'text-espresso'}`}>{p.stock}</span>
              <button onClick={()=>updateStock(p.id,1)} className="h-7 w-7 grid place-items-center hover:bg-amber-100 text-saffrondark"><Icon.Plus size={12}/></button>
            </div>
            {p.stock === 0 ? <span className="text-[10px] font-bold px-1.5 py-0.5 rounded-full bg-stone-800 text-white">Out</span>
              : p.stock < 15 && <span className="text-[10px] font-bold text-berry uppercase">Low</span>}
          </div>
          <div className="col-span-1 mt-3 md:mt-0 flex md:justify-end gap-1">
            <button onClick={()=>startEdit(p)} title="Edit product" className="h-8 w-8 grid place-items-center rounded-lg bg-stone-100 hover:bg-saffron hover:text-white text-stone-600"><Icon.Edit size={14}/></button>
            <button onClick={()=>deleteProduct(p.id)} title="Delete product" className="h-8 w-8 grid place-items-center rounded-lg bg-stone-100 hover:bg-berry hover:text-white text-stone-600"><Icon.Trash size={14}/></button>
          </div>
        </li>)}
      </ul>
    </div>

    {editing && <ProductEditor draft={editing} onClose={()=>setEditing(null)} onSave={saveProduct}/>}
  </div>;
}

function ProductThumb({ p }) {
  const [ok, setOk] = useState(true);
  if (p.image && ok) {
    return <div className="h-14 w-14 shrink-0 rounded-xl overflow-hidden bg-stone-100">
      <img src={p.image} alt={p.name} onError={()=>setOk(false)} className="h-full w-full object-cover"/>
    </div>;
  }
  return <div className="h-14 w-14 shrink-0 rounded-xl bg-gradient-to-br from-amber-100 to-rose-100 grid place-items-center text-2xl">{p.emoji}</div>;
}

function PosTile({ p }) {
  const [ok, setOk] = useState(true);
  if (p.image && ok) {
    return <div className="aspect-square -mx-1 -mt-1 mb-1 rounded-xl overflow-hidden bg-stone-100">
      <img src={p.image} alt="" onError={()=>setOk(false)} className="h-full w-full object-cover"/>
    </div>;
  }
  return <div className="text-3xl mb-1">{p.emoji}</div>;
}

function ProductEditor({ draft, onClose, onSave }) {
  const [p, setP] = useState(draft);
  const [imgErr, setImgErr] = useState(false);
  const [sizeMsg, setSizeMsg] = useState('');
  const fileRef = useRef(null);
  const upd = (k,v) => setP(prev => ({ ...prev, [k]:v }));

  function onPickFile(e) {
    const f = e.target.files?.[0]; if (!f) return;
    if (!f.type.startsWith('image/')) { setSizeMsg('Please pick an image file.'); return; }
    if (f.size > 1.5 * 1024 * 1024) { setSizeMsg(`Image is ${(f.size/1024/1024).toFixed(1)}MB — please keep under 1.5MB (we store it inline).`); return; }
    const r = new FileReader();
    r.onload = () => { upd('image', r.result); setImgErr(false); setSizeMsg(`✓ Uploaded ${(f.size/1024).toFixed(0)}KB`); };
    r.readAsDataURL(f);
  }

  const isNew = p.id == null;
  return <div className="fixed inset-0 z-50 flex">
    <div className="absolute inset-0 bg-black/50" onClick={onClose}/>
    <div className="relative ml-auto h-full w-full max-w-xl bg-white shadow-2xl flex flex-col animate-fade-in">
      <div className="shrink-0 px-5 py-4 border-b border-stone-100 flex items-center justify-between">
        <div>
          <div className="font-serif font-bold text-lg">{isNew ? 'Add New Product' : 'Edit Product'}</div>
          <div className="text-xs text-stone-500">{isNew ? 'Fill in details below · all fields required except image/description' : `ID: ${p.id}`}</div>
        </div>
        <button onClick={onClose} className="h-9 w-9 grid place-items-center rounded-full hover:bg-stone-100"><Icon.X size={18}/></button>
      </div>

      <div className="flex-1 overflow-y-auto p-5 space-y-4">
        {/* Image preview + upload */}
        <div>
          <div className="text-xs font-semibold uppercase tracking-wider text-stone-500 mb-2">Product Image</div>
          <div className="flex gap-3">
            <div className="h-28 w-28 shrink-0 rounded-2xl overflow-hidden bg-gradient-to-br from-amber-100 to-rose-100 grid place-items-center border border-stone-200">
              {p.image && !imgErr
                ? <img src={p.image} alt="" onError={()=>setImgErr(true)} className="h-full w-full object-cover"/>
                : <div className="text-5xl">{p.emoji || '📦'}</div>}
            </div>
            <div className="flex-1 space-y-2">
              <input value={p.image || ''} onChange={e=>{ upd('image', e.target.value); setImgErr(false); setSizeMsg(''); }} placeholder="Paste image URL (https://…)" className="w-full px-3 py-2 rounded-lg border border-stone-200 text-sm outline-none focus:border-saffron focus:ring-2 focus:ring-amber-100"/>
              <div className="flex items-center gap-2">
                <button onClick={()=>fileRef.current?.click()} className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-stone-100 hover:bg-stone-200 text-xs font-semibold"><Icon.Download size={13} cls="rotate-180"/> Upload file</button>
                <input ref={fileRef} type="file" accept="image/*" onChange={onPickFile} className="hidden"/>
                {p.image && <button onClick={()=>{ upd('image',''); setSizeMsg(''); }} className="text-xs text-berry hover:underline">Remove</button>}
              </div>
              {sizeMsg && <div className={`text-[11px] ${sizeMsg.startsWith('✓')?'text-emerald-700':'text-berry'}`}>{sizeMsg}</div>}
              {imgErr && p.image && <div className="text-[11px] text-berry">Image URL failed to load. Falls back to emoji.</div>}
            </div>
          </div>
        </div>

        {/* Emoji */}
        <div>
          <div className="text-xs font-semibold uppercase tracking-wider text-stone-500 mb-2">Emoji Fallback <span className="text-stone-400 normal-case font-normal">(shown when no image)</span></div>
          <div className="flex items-center gap-2 flex-wrap bg-stone-50 rounded-xl p-2 border border-stone-100 max-h-28 overflow-y-auto">
            {EMOJI_CHOICES.map(e => <button key={e} onClick={()=>upd('emoji', e)} className={`h-9 w-9 rounded-lg text-xl grid place-items-center transition ${p.emoji===e?'bg-saffron ring-2 ring-amber-300 scale-110':'bg-white hover:bg-amber-100'}`}>{e}</button>)}
            <input value={p.emoji||''} onChange={e=>upd('emoji', e.target.value.slice(0,4))} className="h-9 w-16 rounded-lg border border-stone-200 text-center text-xl bg-white" placeholder="…"/>
          </div>
        </div>

        {/* Name */}
        <Field label="Product Name" required>
          <input value={p.name} onChange={e=>upd('name', e.target.value)} placeholder="e.g. Classic Rosogolla" className={fc()}/>
        </Field>

        {/* Category */}
        <Field label="Category">
          <select value={p.cat} onChange={e=>upd('cat', e.target.value)} className={fc()}>
            {CAT.map(c => <option key={c.id} value={c.id}>{c.emoji} {c.label}</option>)}
          </select>
        </Field>

        {/* Description */}
        <Field label="Short Description" hint="Shown under the product name in the storefront">
          <textarea value={p.desc||''} onChange={e=>upd('desc', e.target.value)} rows={2} maxLength={160} placeholder="Soft spongy syrup-soaked chhana balls, fresh each morning" className={fc()}/>
          <div className="text-[10px] text-stone-400 text-right mt-0.5">{(p.desc||'').length}/160</div>
        </Field>

        <div className="grid grid-cols-3 gap-3">
          <Field label="Price (৳)" required>
            <input value={p.price} onChange={e=>upd('price', e.target.value.replace(/\D/g,''))} inputMode="numeric" className={fc()} placeholder="0"/>
          </Field>
          <Field label="Unit">
            <input value={p.unit} onChange={e=>upd('unit', e.target.value)} placeholder="pc, kg, 1 lb…" className={fc()}/>
          </Field>
          <Field label="Stock">
            <input value={p.stock} onChange={e=>upd('stock', e.target.value.replace(/\D/g,''))} inputMode="numeric" className={fc()} placeholder="0"/>
          </Field>
        </div>

        {/* Live preview */}
        <div>
          <div className="text-xs font-semibold uppercase tracking-wider text-stone-500 mb-2">Preview</div>
          <div className="bg-white border border-stone-100 rounded-2xl overflow-hidden shadow-sm max-w-xs">
            <div className="aspect-[4/3] bg-gradient-to-br from-amber-50 to-rose-50 grid place-items-center overflow-hidden">
              {p.image && !imgErr
                ? <img src={p.image} alt="" onError={()=>setImgErr(true)} className="h-full w-full object-cover"/>
                : <div className="text-6xl">{p.emoji || '📦'}</div>}
            </div>
            <div className="p-3">
              <div className="font-semibold text-sm">{p.name || 'Product name'}</div>
              <div className="text-[11px] text-stone-500 line-clamp-2 mt-0.5 min-h-[14px]">{p.desc || 'Short description…'}</div>
              <div className="mt-2 flex items-center justify-between">
                <div className="font-bold text-lg">{BDT(Number(p.price)||0)}</div>
                <div className="text-[10px] text-stone-400">per {p.unit}</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div className="shrink-0 border-t border-stone-100 p-4 flex items-center justify-end gap-2">
        <button onClick={onClose} className="px-4 py-2 rounded-full text-sm font-semibold border border-stone-200 hover:bg-stone-50">Cancel</button>
        <button onClick={()=>onSave(p)} className="inline-flex items-center gap-1.5 bg-saffron text-white px-5 py-2 rounded-full text-sm font-semibold hover:bg-saffrondark"><Icon.Check size={15}/> {isNew ? 'Create Product' : 'Save Changes'}</button>
      </div>
    </div>
  </div>;
}

const fc = (err) => `w-full px-3 py-2 rounded-lg border bg-white text-sm outline-none focus:ring-2 ${err?'border-berry focus:border-berry focus:ring-rose-100':'border-stone-200 focus:border-saffron focus:ring-amber-100'}`;
function Field({ label, required, hint, children }) {
  return <label className="block">
    <div className="text-xs font-semibold uppercase tracking-wider text-stone-500 mb-1.5">{label} {required && <span className="text-berry">*</span>}</div>
    {children}
    {hint && <div className="text-[11px] text-stone-400 mt-1">{hint}</div>}
  </label>;
}

/* ============================================================
   Celebration Club tab
   ============================================================ */
function Celeb({ celeb, setCeleb }) {
  const today = new Date(); today.setHours(0,0,0,0);
  const sorted = [...celeb].sort((a,b) => new Date(a.date) - new Date(b.date));
  function remove(i) { if (!confirm('Remove this celebration entry?')) return; setCeleb(prev => prev.filter((_,k)=>k!==i)); }
  function sendReminder(c) { window.open(`https://wa.me/${c.phone.replace(/\D/g,'').replace(/^0/,'88')}?text=${encodeURIComponent(`Hi! It's almost ${c.person}'s ${c.occasion.toLowerCase()} on ${c.date}. Get 10% off any Mishti & More birthday combo as our gift — show this message at checkout. 🎂`)}`,'_blank'); }

  const upcoming7 = sorted.filter(c => { const d=new Date(c.date); return (d-today)/(86400*1000) <= 7 && (d-today)/(86400*1000) >= 0; });
  const upcoming30 = sorted.filter(c => { const d=new Date(c.date); const diff=(d-today)/(86400*1000); return diff > 7 && diff <= 30; });
  const later = sorted.filter(c => { const d=new Date(c.date); return (d-today)/(86400*1000) > 30; });

  return <div className="p-4 sm:p-6 lg:p-8 space-y-6">
    <div className="flex items-end justify-between flex-wrap gap-2">
      <div>
        <h1 className="font-serif text-3xl font-black">Celebration Club CRM</h1>
        <p className="text-stone-500 text-sm mt-1">Birthdays &amp; anniversaries shared by customers. Send 10%-off reminders in one click.</p>
      </div>
      <button className="inline-flex items-center gap-1.5 bg-espresso text-cream px-4 py-2 rounded-full text-sm font-semibold hover:bg-stone-800"><Icon.Plus size={15}/> Add Entry</button>
    </div>

    <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
      <Kpi icon={<Icon.Heart size={18}/>} tone="rose" label="Total Members" value={celeb.length}/>
      <Kpi icon={<Icon.Clock size={18}/>} tone="amber" label="Next 7 Days" value={upcoming7.length}/>
      <Kpi icon={<Icon.Gift size={18}/>} tone="emerald" label="Next 30 Days" value={upcoming30.length + upcoming7.length}/>
    </div>

    {[['🎯 This Week', upcoming7],['📅 This Month', upcoming30],['⏳ Later', later]].map(([title, arr]) => arr.length > 0 && <Card key={title}>
      <CardHead title={`${title} · ${arr.length}`}/>
      <ul className="divide-y divide-stone-100">
        {arr.map((c,i) => {
          const d = new Date(c.date);
          const days = Math.round((d - today)/(86400*1000));
          return <li key={c.person+i} className="py-3 flex items-center gap-3">
            <div className="h-11 w-11 rounded-full bg-gradient-to-br from-rose-100 to-amber-100 text-berry grid place-items-center"><Icon.Heart size={18}/></div>
            <div className="flex-1 min-w-0">
              <div className="flex items-center gap-2 flex-wrap">
                <div className="font-semibold">{c.person}</div>
                <span className="text-[10px] font-bold uppercase tracking-wider bg-rose-100 text-berry px-1.5 py-0.5 rounded-full">{c.occasion}</span>
              </div>
              <div className="text-xs text-stone-500 flex items-center gap-2 mt-0.5"><Icon.Phone size={11}/> {c.phone}</div>
            </div>
            <div className="text-right">
              <div className="text-sm font-bold">{fmtDate(c.date)}</div>
              <div className={`text-[10px] font-bold ${days<=3?'text-berry':days<=7?'text-amber-700':'text-stone-500'}`}>{days===0?'TODAY':`in ${days}d`}</div>
            </div>
            <button onClick={()=>sendReminder(c)} title="Send WhatsApp reminder" className="h-9 w-9 grid place-items-center rounded-full bg-emerald-500 text-white hover:bg-emerald-600"><Icon.Whats size={16}/></button>
            <button onClick={()=>remove(celeb.indexOf(c))} title="Remove" className="h-9 w-9 grid place-items-center rounded-full text-stone-400 hover:bg-rose-50 hover:text-berry"><Icon.Trash size={15}/></button>
          </li>;
        })}
      </ul>
    </Card>)}
  </div>;
}

/* ============================================================
   Walk-in POS tab
   ============================================================ */
function Pos({ products, setProducts, orders, setOrders }) {
  const [filter, setFilter] = useState('all');
  const [search, setSearch] = useState('');
  const [tray, setTray] = useState([]);
  const [paid, setPaid] = useState(null);

  const list = useMemo(() => {
    let l = products.filter(p => p.stock > 0);
    if (filter!=='all') l = l.filter(p => p.cat===filter);
    if (search.trim()) l = l.filter(p => p.name.toLowerCase().includes(search.toLowerCase()));
    return l;
  }, [products, filter, search]);

  function add(p) { setTray(prev => {
    const idx = prev.findIndex(x=>x.id===p.id);
    if (idx>=0) { const n=[...prev]; n[idx]={...n[idx], qty:n[idx].qty+1}; return n; }
    return [...prev, { id:p.id, name:p.name, emoji:p.emoji, unitPrice:p.price, unit:p.unit, qty:1 }];
  }); }
  function dec(id) { setTray(prev => prev.flatMap(x => x.id===id ? (x.qty>1?[{...x, qty:x.qty-1}]:[]) : [x])); }
  function inc(id) { setTray(prev => prev.map(x => x.id===id ? {...x, qty:x.qty+1} : x)); }
  function remove(id) { setTray(prev => prev.filter(x => x.id!==id)); }

  const subtotal = tray.reduce((s,i)=>s+i.unitPrice*i.qty, 0);

  function checkout(method) {
    if (tray.length === 0) return;
    const now = new Date();
    const id = `MM-2026-${(9000 + Math.floor(Math.random()*999)).toString()}`;
    const order = {
      id, placedAt: now.toISOString(),
      customer: { name:'Walk-in Customer', phone:'—', area:'—', addr:'Dhanmondi counter' },
      fulfillment:'pickup', items: tray.map(i => ({ ...i })), subtotal, bundle:0, deliveryFee:0, packaging:0, grand:subtotal,
      status:'delivered', payment: method, note:'POS counter sale',
    };
    setOrders(prev => [order, ...prev]);
    setProducts(prev => prev.map(p => {
      const t = tray.find(x=>x.id===p.id);
      return t ? {...p, stock: Math.max(0, p.stock - t.qty)} : p;
    }));
    setPaid({ order, method });
    setTray([]);
  }

  return <div className="flex flex-col lg:flex-row h-full lg:h-[calc(100vh-4rem)]">
    {/* Product grid */}
    <div className="flex-1 p-4 sm:p-6 overflow-y-auto">
      <div className="flex items-end justify-between mb-4 flex-wrap gap-2">
        <div>
          <h1 className="font-serif text-2xl font-black">Walk-in POS</h1>
          <p className="text-stone-500 text-xs mt-1">Tap items to add to the counter tray. Stock auto-decrements on sale.</p>
        </div>
        <div className="relative">
          <Icon.Search cls="absolute left-3 top-1/2 -translate-y-1/2 text-stone-400" size={14}/>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search" className="pl-8 pr-3 h-9 rounded-full bg-white border border-stone-200 text-xs outline-none focus:ring-2 focus:ring-amber-100 w-56"/>
        </div>
      </div>
      <div className="flex gap-1 overflow-x-auto no-scrollbar mb-3">
        <FilterPill active={filter==='all'} onClick={()=>setFilter('all')} label="All"/>
        {CAT.map(c => <FilterPill key={c.id} active={filter===c.id} onClick={()=>setFilter(c.id)} label={`${c.emoji} ${c.label}`}/>)}
      </div>
      <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-2.5">
        {list.map(p => <button key={p.id} onClick={()=>add(p)} className="bg-white border border-stone-100 rounded-2xl p-3 text-left hover:border-saffron hover:shadow-md active:scale-95 transition">
          <PosTile p={p}/>
          <div className="text-xs font-semibold leading-snug line-clamp-2 h-8 mt-1">{p.name}</div>
          <div className="mt-1.5 flex items-end justify-between">
            <span className="font-bold text-sm">{BDT(p.price)}</span>
            <span className={`text-[10px] font-bold ${p.stock<15?'text-berry':'text-stone-400'}`}>{p.stock} left</span>
          </div>
        </button>)}
      </div>
    </div>

    {/* Tray */}
    <aside className="w-full lg:w-96 lg:border-l border-t lg:border-t-0 border-stone-200 bg-white flex flex-col">
      <div className="px-5 py-4 border-b border-stone-100">
        <div className="flex items-center gap-2"><Icon.Pos size={18} cls="text-saffron"/><div className="font-serif font-bold">Counter Tray</div></div>
        <div className="text-xs text-stone-500 mt-0.5">{tray.length} line{tray.length!==1?'s':''} · {tray.reduce((s,i)=>s+i.qty,0)} items</div>
      </div>
      <div className="flex-1 overflow-y-auto p-3">
        {tray.length === 0 && <div className="text-center text-stone-400 p-10 text-sm">Tap products to add</div>}
        {tray.map(i => <div key={i.id} className="flex items-center gap-2 py-2 border-b border-stone-50">
          <div className="text-2xl">{i.emoji}</div>
          <div className="flex-1 min-w-0">
            <div className="text-xs font-semibold truncate">{i.name}</div>
            <div className="text-[10px] text-stone-500">{BDT(i.unitPrice)} · {i.unit}</div>
          </div>
          <div className="inline-flex items-center rounded-full bg-amber-50 border border-amber-200 overflow-hidden">
            <button onClick={()=>dec(i.id)} className="h-6 w-6 grid place-items-center text-saffrondark hover:bg-amber-100"><Icon.Minus size={11}/></button>
            <span className="min-w-[22px] text-center text-xs font-bold">{i.qty}</span>
            <button onClick={()=>inc(i.id)} className="h-6 w-6 grid place-items-center text-saffrondark hover:bg-amber-100"><Icon.Plus size={11}/></button>
          </div>
          <div className="w-14 text-right text-xs font-bold">{BDT(i.unitPrice*i.qty)}</div>
          <button onClick={()=>remove(i.id)} className="text-stone-300 hover:text-berry"><Icon.X size={14}/></button>
        </div>)}
      </div>
      <div className="border-t border-stone-100 p-4 space-y-2">
        <div className="flex items-center justify-between">
          <div className="font-serif font-bold">Total</div>
          <div className="font-serif font-black text-2xl">{BDT(subtotal)}</div>
        </div>
        <div className="grid grid-cols-3 gap-2">
          <button disabled={tray.length===0} onClick={()=>checkout('cash')} className="bg-emerald-500 text-white py-2.5 rounded-xl text-xs font-semibold disabled:opacity-40 hover:bg-emerald-600 inline-flex flex-col items-center gap-0.5"><Icon.Bank size={14}/> Cash</button>
          <button disabled={tray.length===0} onClick={()=>checkout('bkash')} className="bg-pink-500 text-white py-2.5 rounded-xl text-xs font-semibold disabled:opacity-40 hover:bg-pink-600 inline-flex flex-col items-center gap-0.5"><Icon.Wallet size={14}/> bKash</button>
          <button disabled={tray.length===0} onClick={()=>checkout('card')} className="bg-espresso text-white py-2.5 rounded-xl text-xs font-semibold disabled:opacity-40 hover:bg-stone-800 inline-flex flex-col items-center gap-0.5"><Icon.Card size={14}/> Card</button>
        </div>
        {tray.length > 0 && <button onClick={()=>setTray([])} className="w-full text-xs text-stone-500 hover:text-berry">Clear tray</button>}
      </div>
    </aside>

    {paid && <div className="fixed inset-0 z-50 grid place-items-center p-4">
      <div className="absolute inset-0 bg-black/50" onClick={()=>setPaid(null)}/>
      <div className="relative bg-white rounded-3xl shadow-2xl max-w-sm w-full p-6 animate-pop">
        <div className="mx-auto h-16 w-16 rounded-full bg-emerald-100 text-emerald-600 grid place-items-center animate-pop"><Icon.Check size={36}/></div>
        <div className="text-center mt-3">
          <div className="font-serif font-black text-xl">Sale Completed</div>
          <div className="text-xs text-stone-500">Order <span className="font-mono font-bold">#{paid.order.id}</span></div>
          <div className="mt-3 font-serif font-black text-3xl text-saffrondark">{BDT(paid.order.grand)}</div>
          <div className="text-[11px] uppercase tracking-wider text-stone-500">paid via {paid.method}</div>
        </div>
        <div className="mt-5 grid grid-cols-2 gap-2">
          <button onClick={()=>window.print()} className="bg-stone-100 text-espresso py-2.5 rounded-xl text-sm font-semibold inline-flex items-center justify-center gap-1.5"><Icon.Printer size={15}/> Print</button>
          <button onClick={()=>setPaid(null)} className="bg-espresso text-cream py-2.5 rounded-xl text-sm font-semibold">Next Customer</button>
        </div>
      </div>
    </div>}
  </div>;
}

/* ============================================================
   Reports tab
   ============================================================ */
function Reports({ orders }) {
  const today = new Date(); today.setHours(0,0,0,0);
  const alive = orders.filter(o => o.status !== 'cancelled');

  const byCategory = useMemo(() => {
    const m = {};
    CAT.forEach(c => m[c.id] = { label:c.label, emoji:c.emoji, revenue:0, qty:0 });
    alive.forEach(o => o.items.forEach(i => {
      const p = PRODUCTS_SEED.find(x=>x.id===i.id); if (!p) return;
      m[p.cat].revenue += i.unitPrice * i.qty;
      m[p.cat].qty += i.qty;
    }));
    return Object.entries(m).sort((a,b)=>b[1].revenue-a[1].revenue);
  }, [alive]);

  const byPayment = useMemo(() => {
    const m = { bkash:0, card:0, cod:0, cash:0 };
    alive.forEach(o => { m[o.payment] = (m[o.payment]||0) + o.grand; });
    return m;
  }, [alive]);

  const byArea = useMemo(() => {
    const m = {};
    alive.forEach(o => { const a = o.customer.area; if (a==='—') return; m[a] = (m[a]||0) + o.grand; });
    return Object.entries(m).sort((a,b)=>b[1]-a[1]);
  }, [alive]);

  const total = alive.reduce((s,o)=>s+o.grand,0);
  const maxCat = Math.max(...byCategory.map(([,v])=>v.revenue), 1);
  const maxArea = Math.max(...byArea.map(([,v])=>v), 1);
  const paymentTotal = Object.values(byPayment).reduce((s,v)=>s+v, 0);

  return <div className="p-4 sm:p-6 lg:p-8 space-y-6">
    <div>
      <h1 className="font-serif text-3xl font-black">Reports</h1>
      <p className="text-stone-500 text-sm mt-1">Sales breakdown across categories, payment methods and delivery zones.</p>
    </div>

    <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
      <Kpi icon={<Icon.Wallet size={18}/>} tone="emerald" label="Total Revenue" value={BDT(total)}/>
      <Kpi icon={<Icon.Cart size={18}/>} tone="saffron" label="Orders" value={alive.length}/>
      <Kpi icon={<Icon.Up size={18}/>} tone="rose" label="Avg Order Value" value={BDT(alive.length?total/alive.length:0)}/>
      <Kpi icon={<Icon.Truck size={18}/>} tone="amber" label="Delivery Orders" value={alive.filter(o=>o.fulfillment==='delivery').length}/>
    </div>

    <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
      <Card>
        <CardHead title="Revenue by Category"/>
        <div className="space-y-2 mt-2">
          {byCategory.map(([id,v]) => <div key={id}>
            <div className="flex items-center justify-between text-xs mb-1">
              <span className="font-semibold">{v.emoji} {v.label}</span>
              <span className="font-bold">{BDT(v.revenue)} <span className="text-stone-400 font-normal">· {v.qty} items</span></span>
            </div>
            <div className="h-2 rounded-full bg-stone-100 overflow-hidden">
              <div className="h-full bg-gradient-to-r from-saffron to-berry" style={{ width:`${(v.revenue/maxCat)*100}%` }}/>
            </div>
          </div>)}
        </div>
      </Card>

      <Card>
        <CardHead title="Payment Methods"/>
        <div className="space-y-3 mt-3">
          {[
            { id:'bkash', label:'bKash / Nagad', color:'bg-pink-500', icon:<Icon.Wallet size={14}/> },
            { id:'card',  label:'Credit / Debit Card', color:'bg-espresso', icon:<Icon.Card size={14}/> },
            { id:'cod',   label:'Cash on Delivery',    color:'bg-amber-500', icon:<Icon.Bank size={14}/> },
            { id:'cash',  label:'Counter Cash (POS)',  color:'bg-emerald-500', icon:<Icon.Bank size={14}/> },
          ].map(m => <div key={m.id}>
            <div className="flex items-center justify-between text-xs mb-1">
              <span className="font-semibold inline-flex items-center gap-1.5">{m.icon} {m.label}</span>
              <span className="font-bold">{BDT(byPayment[m.id]||0)} <span className="text-stone-400 font-normal">· {paymentTotal?Math.round((byPayment[m.id]||0)/paymentTotal*100):0}%</span></span>
            </div>
            <div className="h-2 rounded-full bg-stone-100 overflow-hidden">
              <div className={`h-full ${m.color}`} style={{ width:`${paymentTotal?(byPayment[m.id]||0)/paymentTotal*100:0}%` }}/>
            </div>
          </div>)}
        </div>
      </Card>

      <Card className="lg:col-span-2">
        <CardHead title="Revenue by Delivery Area"/>
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-2">
          {byArea.map(([area,rev]) => <div key={area}>
            <div className="flex items-center justify-between text-xs mb-1">
              <span className="font-semibold inline-flex items-center gap-1.5"><Icon.MapPin size={12}/> {area}</span>
              <span className="font-bold">{BDT(rev)}</span>
            </div>
            <div className="h-2 rounded-full bg-stone-100 overflow-hidden">
              <div className="h-full bg-gradient-to-r from-sky-400 to-saffron" style={{ width:`${(rev/maxArea)*100}%` }}/>
            </div>
          </div>)}
        </div>
      </Card>
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
