<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#00900a"/>
      <stop offset="55%"  stop-color="#0ea8c8"/>
      <stop offset="100%" stop-color="#1e90ff"/>
    </linearGradient>
    <radialGradient id="shine" cx="30%" cy="28%" r="55%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="badgeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.20"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="192" height="192" rx="43" ry="43" fill="url(#bgGrad)"/>
  <rect width="192" height="192" rx="43" ry="43" fill="url(#shine)"/>
  <rect x="1.5" y="1.5" width="189" height="189" rx="42" ry="42"
        fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1.5"/>

  <!-- ৳ symbol -->
  <text
    x="96"
    y="100"
    font-family="'Noto Sans Bengali', 'Mukti', 'Arial Unicode MS', 'Segoe UI', sans-serif"
    font-size="112"
    font-weight="900"
    fill="#ffffff"
    fill-opacity="0.96"
    text-anchor="middle"
    dominant-baseline="central"
  >৳</text>

  <!-- Badge -->
  <circle cx="150" cy="150" r="20" fill="#ffffff" fill-opacity="0.97" filter="url(#badgeShadow)"/>
  <circle cx="150" cy="150" r="20" fill="none" stroke="#00900a" stroke-width="1" stroke-opacity="0.25"/>
  <polyline points="140,150 148,158 162,142"
            stroke="#00900a" stroke-width="6"
            stroke-linecap="round" stroke-linejoin="round"
            fill="none"/>
</svg>
